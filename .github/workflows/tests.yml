# Terminal Arcade — tests
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Contributors show up on all three. If the arcade breaks on Windows
        # we want to know from CI, not from someone at the event.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        env:
          NO_COLOR: "1"   # keep assertions comparing plain strings
        run: python -m pytest -v

  imports:
    name: every game is importable and registered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Catches the most common mistake in a "add a game" PR: the file is
      # written but never added to GAMES in main.py.
      - name: Check the registry
        run: |
          python - <<'PY'
          import pathlib, sys
          from arcade.main import GAMES

          registered = {g.__name__.rsplit(".", 1)[-1] for g in GAMES}
          on_disk = {
              p.stem for p in pathlib.Path("arcade/games").glob("*.py")
              if p.stem != "__init__"
          }

          missing = on_disk - registered
          if missing:
              print(f"::error::These games exist but are not in GAMES in arcade/main.py: {sorted(missing)}")
              print("Add them to the GAMES list so they appear in the menu.")
              sys.exit(1)

          for game in GAMES:
              for attr in ("NAME", "DESCRIPTION", "play"):
                  if not hasattr(game, attr):
                      print(f"::error::{game.__name__} is missing {attr}")
                      sys.exit(1)

          print(f"All {len(GAMES)} games registered correctly.")
          PY
